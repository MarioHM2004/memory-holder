<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Holder</title>
<!--
  Shown when a page is asked for and there is no connection.
  Deliberately standalone: no fonts, no scripts, nothing to fetch — it is the
  one page that has to render when fetching is exactly what isn't working.
  And no translations, because the worker serving it has no idea which
  language was chosen, so all three are here.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 2rem; text-align: center; line-height: 1.6;
    background: #fbfaf7; color: #171614;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial,
      "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card { max-width: 24rem; border: 2px solid #171614; background: #fff; padding: 2.5rem 2rem; }
  .mark { margin: 0; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: #8e8a80; }
  h1 { margin: 1.25rem 0 1rem; font-size: 1.35rem; line-height: 1.3; }
  p.line { margin: 0 0 .5rem; color: #56534c; font-size: .95rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #171612; color: #f4f1e8; }
    .card { background: #22201a; border-color: #f4f1e8; }
    p.line { color: #b8b2a4; }
  }
</style>
</head>
<body>
  <div class="card">
    <p class="mark">Memory&nbsp;Holder</p>
    <h1>No connection</h1>
    <p class="line">The diary needs one to open. Try again once you're back online.</p>
    <p class="line">日记需要网络才能打开。恢复连接后请重试。</p>
    <p class="line">El diario necesita conexión para abrirse. Inténtalo otra vez cuando vuelvas a tenerla.</p>
  </div>
</body>
</html>
