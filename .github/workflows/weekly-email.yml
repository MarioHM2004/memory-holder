# Sends everyone a memory from their diary, once a week.
#
# The app does the work — it has the database, the translations and the
# email template. This only wakes it up, because Vercel's own cron is a paid
# feature and a GitHub schedule isn't.
#
# Secrets, under Settings → Secrets and variables → Actions:
#   SITE_URL      https://memory-holder.com
#   CRON_SECRET   a long random string, the same value set in Vercel
#
# The endpoint also needs RESEND_API_KEY and SUPABASE_SERVICE_ROLE_KEY set in
# Vercel. See docs/weekly-email.md.

name: Weekly email

on:
  schedule:
    # Sunday morning, after the backup and off the hour.
    - cron: "23 8 * * 0"
  workflow_dispatch:

jobs:
  send:
    if: github.repository == 'MarioHM2004/memory-holder'
    runs-on: ubuntu-latest
    steps:
      - name: Ask the app to send
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SITE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::SITE_URL or CRON_SECRET is not set. See docs/weekly-email.md."
            exit 1
          fi

          status=$(curl -s -S -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 120 \
            "${SITE_URL}/api/weekly-digest")

          echo "HTTP ${status}"
          cat response.json
          echo

          # The endpoint answers 500 when any single send failed, with the
          # addresses and reasons in the body. Quietly dropping one person's
          # email every week is exactly the failure nobody would notice.
          if [ "${status}" != "200" ]; then
            echo "::error::The send reported a problem: $(head -c 400 response.json)"
            exit 1
          fi
